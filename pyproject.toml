[project]
name = "log-analyzer"
version = "0.1.0"
description = "Sample a random number of structured log lines and get a structured root-cause analysis from a switchable LLM provider (Claude / Gemini / NVIDIA Kimi K2)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    # LLM provider SDKs
    "anthropic==0.111.0",  # Claude
    "google-genai>=1.0",   # Gemini
    "openai>=1.40",        # NVIDIA NIM (Kimi K2) via OpenAI-compatible endpoint
]

[project.scripts]
log-analyzer = "log_analyzer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["log_analyzer"]

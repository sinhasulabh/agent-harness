# Which provider to use: claude | gemini | nvidia
provider: nvidia

# Path to the structured log CSV (relative to project root or absolute)
log_file: sample.csv

# How many log lines to pull from the file each run.
# A random count is chosen in [min_size, max_size]; that's the "random number
# of log data" sent to the LLM. Tune these to adjust the sample size.
sampling:
  min_size: 1
  max_size: 25
  strategy: contiguous   # contiguous = a random consecutive window (keeps events correlated)
                         # random     = a random scatter of individual lines
  seed: null             # set an int for reproducible sampling, null for fresh randomness

# Model id per provider. Switch `provider` above to change which one runs.
models:
  claude: claude-sonnet-4-6
  gemini: gemini-2.5-flash
  nvidia: meta/llama-3.3-70b-instruct

# Max output tokens per individual model response.
max_tokens: 4096

# Stop conditions for the tool loop, checked every iteration before the next
# model call. Not a single cap — a small policy (see agent_loop.py).
budgets:
  max_steps: 6        # max model round-trips in the loop
  max_tokens: 60000   # cumulative input+output tokens across the whole loop
  max_seconds: null   # optional wall-clock cap in seconds (null = disabled)
